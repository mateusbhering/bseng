<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e8e3"/>
      <stop offset="1" stop-color="#d3d6d0"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c3c7c0"/>
      <stop offset="1" stop-color="#adb2ab"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f948d"/>
      <stop offset="1" stop-color="#7c817b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1125" fill="url(#sky)"/>
  <!-- volume principal -->
  <rect x="150" y="140" width="440" height="985" fill="url(#face)"/>
  <rect x="590" y="140" width="210" height="985" fill="url(#shade)"/>
  <!-- lajes -->
  <g fill="#9ba099">
    <rect x="150" y="240" width="440" height="10"/>
    <rect x="150" y="360" width="440" height="10"/>
    <rect x="150" y="480" width="440" height="10"/>
    <rect x="150" y="600" width="440" height="10"/>
    <rect x="150" y="720" width="440" height="10"/>
    <rect x="150" y="840" width="440" height="10"/>
    <rect x="150" y="960" width="440" height="10"/>
  </g>
  <g fill="#6f746e">
    <rect x="590" y="240" width="210" height="10"/>
    <rect x="590" y="360" width="210" height="10"/>
    <rect x="590" y="480" width="210" height="10"/>
    <rect x="590" y="600" width="210" height="10"/>
    <rect x="590" y="720" width="210" height="10"/>
    <rect x="590" y="840" width="210" height="10"/>
    <rect x="590" y="960" width="210" height="10"/>
  </g>
  <!-- pilares -->
  <g fill="#b6bab3">
    <rect x="220" y="140" width="22" height="985"/>
    <rect x="360" y="140" width="22" height="985"/>
    <rect x="500" y="140" width="22" height="985"/>
  </g>
  <rect x="150" y="140" width="14" height="985" fill="#d0d3cd"/>
  <!-- acento verde: prumada -->
  <rect x="588" y="140" width="4" height="985" fill="#205820"/>
  <!-- marcações técnicas -->
  <g stroke="#171a18" stroke-width="1" opacity="0.35">
    <line x1="100" y1="140" x2="100" y2="1125"/>
    <line x1="92" y1="240" x2="108" y2="240"/>
    <line x1="92" y1="600" x2="108" y2="600"/>
    <line x1="92" y1="960" x2="108" y2="960"/>
  </g>
  <text x="64" y="420" font-family="monospace" font-size="13" letter-spacing="3" fill="#171a18" opacity="0.4" transform="rotate(-90 64 420)">BSE / EST. 1991</text>
</svg>
