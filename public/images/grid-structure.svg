    <rect x="110" y="510" width="80" height="80"/>
    <rect x="310" y="510" width="80" height="80"/>
    <rect x="710" y="510" width="80" height="80"/>
    <rect x="110" y="710" width="80" height="80"/>
    <rect x="310" y="710" width="80" height="80"/>
    <rect x="510" y="710" width="80" height="80"/>
    <rect x="710" y="710" width="80" height="80"/>
  </g>
  <!-- pilares -->
  <g fill="#054205">
    <rect x="136" y="136" width="28" height="28"/>
    <rect x="336" y="136" width="28" height="28"/>
    <rect x="536" y="136" width="28" height="28"/>
    <rect x="736" y="136" width="28" height="28"/>
    <rect x="136" y="336" width="28" height="28"/>
    <rect x="536" y="336" width="28" height="28"/>
    <rect x="736" y="336" width="28" height="28"/>
    <rect x="136" y="536" width="28" height="28"/>
