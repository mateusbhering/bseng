  <g font-family="monospace" font-size="15" fill="#171a18" opacity="0.5">
    <text x="144" y="60">A</text>
    <text x="344" y="60">B</text>
    <text x="544" y="60">C</text>
    <text x="744" y="60">D</text>
    <text x="46" y="156">1</text>
    <text x="46" y="356">2</text>
