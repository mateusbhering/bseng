<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="a2-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7e9e4"/>
      <stop offset="1" stop-color="#d2d5cf"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#a2-sky)"/>
  <!-- volumes escalonados -->
  <rect x="120" y="420" width="300" height="320" fill="#b9bdb6"/>
  <rect x="420" y="300" width="340" height="440" fill="#a5aaa3"/>
  <rect x="760" y="180" width="320" height="560" fill="#c2c6bf"/>
  <!-- sombras laterais -->
  <rect x="395" y="420" width="25" height="320" fill="#868b84"/>
  <rect x="735" y="300" width="25" height="440" fill="#7d827c"/>
  <!-- lajes do volume alto -->
  <g fill="#a0a59e">
    <rect x="760" y="270" width="320" height="8"/>
    <rect x="760" y="380" width="320" height="8"/>
    <rect x="760" y="490" width="320" height="8"/>
    <rect x="760" y="600" width="320" height="8"/>
  </g>
  <!-- brises verticais -->
  <g fill="#8f948d">
    <rect x="460" y="340" width="12" height="400"/>
    <rect x="520" y="340" width="12" height="400"/>
    <rect x="580" y="340" width="12" height="400"/>
    <rect x="640" y="340" width="12" height="400"/>
    <rect x="700" y="340" width="12" height="400"/>
  </g>
  <!-- acento -->
  <rect x="120" y="416" width="300" height="4" fill="#205820"/>
  <rect x="0" y="740" width="1200" height="60" fill="#c9cdc6"/>
  <text x="140" y="770" font-family="monospace" font-size="13" letter-spacing="3" fill="#171a18" opacity="0.4">CONCRETE STRUCTURES</text>
</svg>
